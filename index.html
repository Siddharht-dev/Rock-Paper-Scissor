<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rock Paper Scissor</title>
</head>

<body>
    <h2>Rock Paper Scissor</h2>

    <div class="option">
        <div class="rock">
            <img src="images/rock.png" alt="">
        </div>
        <div class="paper">
            <img src="images/paper.png" alt="">
        </div>
        <div class="scissor">
            <img src="images/scissors.png" alt="">
        </div>
    </div>

    <div class="scores">
        <div class="user">
            <h2>You: <span id="user-score">0</span></h2>
        </div>
        <div class="computer">
            <h2>computer: <span id="computer-score">0</span></h2>
        </div>
    </div>

    <div class="message">
        Make your move!
    </div>


    <script src="script.js"></script>
</body>

</html>
